openapi: "3.1.0"
info:
  title: "Fate Oracle API"
  description: "Generate grounded guidance from a quantum-seeded oracle."
  version: "1.0"
servers:
  - url: "https://entropic-api.onrender.com"
paths:
  /oracle:
    post:
      summary: "Get a fate-derived answer"
      operationId: askOracle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
      responses:
        "200":
          description: "Oracle answer"
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
