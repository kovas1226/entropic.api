openapi: "3.1.0"
info:
  title: "Symbolic Quantum API"
  description: "This API interprets quantum simulation results as symbolic archetypes."
  version: "1.0"
servers:
  -
    url: "https://entropic-api.onrender.com"
paths:
  # ... (all your existing paths)
components:
  schemas:
    AskRequest:
      title: "AskRequest"
      required:
        - "question"
      type: "object"
      properties:
        question:
          title: "Question"
          type: "string"
        user_id:
          title: "User Id"
          type: "string"
        seed:
          title: "Seed"
          type: "integer"
      example:
        question: "What is the symbolic meaning of entanglement?"
        user_id: "testuser"
        seed: 123
    CircuitRequest:
      title: "CircuitRequest"
      required:
        - "gates"
      type: "object"
      properties:
        gates:
          title: "Gates"
          type: "array"
          items:
            $ref: "#/components/schemas/GateOp"
        seed:
          title: "Seed"
          type: "integer"
        use_previous:
          title: "Use Previous"
          type: "boolean"
          default: false
      example:
        gates:
          - name: "H"
            qubits: [0]
          - name: "CNOT"
            qubits: [1, 0]
        seed: 42
        use_previous: false
    DensityRequest:
      title: "DensityRequest"
      required:
        - "gates"
      type: "object"
      properties:
        gates:
          title: "Gates"
          type: "array"
          items:
            $ref: "#/components/schemas/GateOp"
        seed:
          title: "Seed"
          type: "integer"
        use_previous:
          title: "Use Previous"
          type: "boolean"
          default: false
        noise:
          title: "Noise"
          type: "object"
          additionalProperties:
            type: "number"
      example:
        gates:
          - name: "X"
            qubits: [0]
          - name: "H"
            qubits: [1]
        seed: 77
        use_previous: false
        noise:
          gamma: 0.2
          qubit: 1
          type: "amplitude"
    EntropyRequest:
      title: "EntropyRequest"
      required:
        - "subsystem"
      type: "object"
      properties:
        subsystem:
          title: "Subsystem"
          type: "array"
          items:
            type: "integer"
      example:
        subsystem: [0, 1]
    GateOp:
      title: "GateOp"
      required:
        - "name"
        - "qubits"
      type: "object"
      properties:
        name:
          title: "Name"
          type: "string"
        qubits:
          title: "Qubits"
          type: "array"
          items:
            type: "integer"
        params:
          title: "Params"
          type: "array"
          items:
            type: "number"
      example:
        name: "Rx"
        qubits: [0]
        params: [1.5708]
    HTTPValidationError:
      title: "HTTPValidationError"
      type: "object"
      properties:
        detail:
          title: "Detail"
          type: "array"
          items:
            $ref: "#/components/schemas/ValidationError"
    IntentRequest:
      title: "IntentRequest"
      required:
        - "intent"
      type: "object"
      properties:
        intent:
          title: "Intent"
          type: "string"
        params:
          title: "Params"
          type: "object"
        seed:
          title: "Seed"
          type: "integer"
      example:
        intent: "emergence"
        params: {}
        seed: 99
    ValidationError:
      title: "ValidationError"
      required:
        - "loc"
        - "msg"
        - "type"
      type: "object"
      properties:
        loc:
          title: "Location"
          type: "array"
          items:
            anyOf:
              - type: "string"
              - type: "integer"
        msg:
          title: "Message"
          type: "string"
        type:
          title: "Error Type"
          type: "string"